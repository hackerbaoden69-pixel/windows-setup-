<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 11 Setup</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><text y='8' font-size='8'>🪟</text></svg>">
<style>
:root{--blue:#0067c0;--ink:#1b1b1b;--sub:#5d5d5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:"Segoe UI Variable","Segoe UI",Selawik,system-ui,sans-serif;color:var(--ink);user-select:none}
#app{position:fixed;inset:0}
.setup{position:absolute;inset:0;background:#1d0b73;display:grid;place-items:center;padding:12px 12px 56px}
.win{width:min(680px,100%);background:#fff;border:1px solid #6b7fcf;box-shadow:0 8px 30px #0006}
.tb{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;border-bottom:1px solid #e5e5e5}
.wb{padding:22px 36px 18px;min-height:380px;display:flex;flex-direction:column;font-size:13px}
.wb h2{font-weight:400;color:#1e4fb0;font-size:19px;margin:0 0 14px}
.wb .grow{flex:1}.wb footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sb{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:60px;padding-left:12px;color:#fff;font-size:12px;border-top:2px solid #6a5acd}
.sb i{font-size:22px;font-style:normal;margin-right:8px}.sb div{position:relative}
.sb b{position:absolute;left:0;top:-2px;height:2px;background:#4caf50;transition:width .4s}
.sbtn{border:1px solid #adadad;background:#e1e1e1;padding:3px 26px;font:inherit;font-size:13px;cursor:pointer}
.sbtn:hover{background:#e5f1fb;border-color:#0078d7}.sbtn:disabled{opacity:.5;cursor:default;background:#e1e1e1;border-color:#adadad}
.big{font-size:34px;font-weight:300;color:#1e4fb0;text-align:center;margin:30px 0 18px}
.fld{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:8px 0}
.fld select,.sin{border:1px solid #7a7a7a;padding:3px;font:inherit}.sin{width:100%}
.lic{border:1px solid #999;height:220px;overflow:auto;padding:10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}th{font-weight:400;text-align:left;border-bottom:1px solid #ddd;padding:3px 6px}td{padding:4px 6px;cursor:default}tr.s td{background:#cce8ff;outline:1px solid #99d1ff}
.prog{height:14px;border:1px solid #bbb;margin:8px 0}.prog div{height:100%;background:#26a0da;width:0;transition:width .3s}
.st li{list-style:none;margin:6px 0;color:#777}.st li.on{color:#000;font-weight:600}.st li.ok{color:#000}.st li.ok:before{content:"✔ ";color:#2e9d3a}
.black{position:absolute;inset:0;background:#000;display:grid;place-items:center;color:#fff;text-align:center;font-size:20px}
.logo{display:grid;grid-template-columns:repeat(2,34px);gap:4px;margin:0 auto 26px;justify-content:center}.logo i{height:34px;background:#0a8cf0}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #ffffff33;border-top-color:#fff;animation:r 1s linear infinite;margin:0 auto 16px}.spin.d{border-color:#0067c033;border-top-color:var(--blue)}
@keyframes r{to{rotate:360deg}}
.oobe{position:absolute;inset:0;background:radial-gradient(1000px 600px at 15% 10%,#dcecfb,transparent),radial-gradient(900px 600px at 90% 90%,#cfe2f6,transparent),#eaf1f9;display:grid;place-items:center;padding:3vh 3vw}
.card{width:100%;height:100%;max-width:1200px;background:#ffffffb8;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 0 0 1px #0000000d,0 10px 40px #1e3a6a1f;position:relative}
.il{display:grid;place-items:center;font-size:clamp(70px,14vw,150px)}
.rt{padding:7vh 5vw 90px 2vw;display:flex;flex-direction:column;overflow:auto}
.rt h1{font-weight:600;font-size:clamp(22px,2.6vw,30px);margin:0 0 10px;line-height:1.2}.rt p{color:var(--sub);font-size:14px;margin:0 0 14px;line-height:1.45}
.bar{position:absolute;right:5vw;bottom:5vh;display:flex;gap:12px;align-items:center}
.btn{background:var(--blue);color:#fff;border:1px solid #0000;border-radius:4px;padding:8px 36px;font:inherit;font-size:14px;cursor:pointer}.btn:hover{background:#1a75c9}.btn:disabled{background:#0000001a;color:#0006;cursor:default}
.btn.g{background:#fff;color:var(--ink);border-color:#0000002e}.btn.g:hover{background:#f5f5f5}.lnk{color:var(--blue);font-size:13px;cursor:pointer;background:none;border:0;text-decoration:underline;font-family:inherit}
.list{border:1px solid #0000001a;background:#fff;border-radius:4px;overflow:auto;max-height:44vh}.list div{padding:11px 14px;font-size:14px;border-bottom:1px solid #00000008;cursor:pointer}.list div:hover{background:#f0f0f0}.list div.s{background:var(--blue);color:#fff}
.in{width:100%;border:1px solid #0000002e;border-bottom:2px solid #0000006e;border-radius:4px;padding:8px 10px;font:inherit;font-size:15px;background:#fff;user-select:text}.in:focus{outline:0;border-bottom-color:var(--blue)}
.err{color:#c42b1c;font-size:13px;min-height:18px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #0000000f;font-size:14px;cursor:pointer}.tg small{display:block;color:var(--sub);font-size:12px;margin-top:2px;max-width:30ch}
.sw{width:42px;height:20px;border-radius:10px;background:#fff;border:1px solid #666;position:relative;flex:none}.sw:after{content:"";position:absolute;top:3px;left:4px;width:12px;height:12px;border-radius:50%;background:#666;transition:.15s}.sw.on{background:var(--blue);border-color:var(--blue)}.sw.on:after{left:26px;background:#fff}
.lock{position:absolute;inset:0;background:radial-gradient(800px 500px at 30% 20%,#2f6fd0,transparent),linear-gradient(135deg,#0a2a8a,#1b64c8 55%,#0b3fa0);display:grid;place-items:center;color:#fff;text-align:center}
.av{width:110px;height:110px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;font-size:54px;margin:0 auto 14px}
.desk{position:absolute;inset:0;background:linear-gradient(100deg,#2c5e12,#6fa832 35%,#3d7a1c 60%,#1d4a0b),#2c5e12}
.di{position:absolute;left:10px;color:#fff;font-size:11px;width:64px;text-align:center;text-shadow:0 1px 3px #000}.di span{font-size:30px;display:block}
.tk{position:absolute;left:0;right:0;bottom:0;height:48px;background:#e9eef5f0;backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:4px;border-top:1px solid #0000001a}
.tk b{width:40px;height:40px;display:grid;place-items:center;border-radius:4px;font-size:21px;cursor:pointer}.tk b:hover{background:#fff8}
.clk{position:absolute;right:12px;font-size:12px;text-align:right;line-height:1.25}
.sm{position:absolute;left:50%;bottom:58px;translate:-50% 0;width:min(620px,96vw);height:min(640px,76vh);background:#f3f6fbf2;backdrop-filter:blur(30px);border-radius:8px;border:1px solid #0000001a;box-shadow:0 8px 40px #0005;padding:22px 30px;display:flex;flex-direction:column;overflow:hidden}
.sm .se{background:#fff;border:1px solid #0000001a;border-bottom:2px solid var(--blue);border-radius:20px;padding:8px 14px;font-size:13px;color:#666}
.gr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 18px}.gr div{text-align:center;font-size:11px;padding:8px 0;border-radius:4px}.gr div:hover{background:#fff9}.gr span{display:block;font-size:26px}
.sm h4{margin:16px 0 4px;font-size:13px}.pw{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:#e4eaf3;margin:auto -30px -22px;padding:14px 30px;font-size:13px}
.hint{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:11px;color:#fff9;pointer-events:none;z-index:9}
@media(max-width:700px){.card{grid-template-columns:1fr}.il{display:none}.rt{padding:5vh 6vw 90px}.wb{padding:16px 18px}.sb{gap:24px}}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app'),U={lang:'English (United States)',region:'Vietnam',kb:'US',dev:'',mail:'',pin:'',priv:[1,1,1,1,1,1]};
const T=ms=>new Promise(r=>setTimeout(r,ms));let tm=[];const later=(f,ms)=>tm.push(setTimeout(f,ms));
function show(h){tm.forEach(clearTimeout);tm=[];A.innerHTML=h}
const $=q=>A.querySelector(q),$$=q=>[...A.querySelectorAll(q)];
const logo='<div class="logo"><i></i><i></i><i></i><i></i></div>';
function setup(body,pct,foot){show(`<div class="setup"><div class="win"><div class="tb">🪟 Windows Setup</div><div class="wb">${body}</div></div><div class="sb"><div><i>1</i>Collecting information<b style="width:${pct[0]}%"></b></div><div><i>2</i>Installing Windows<b style="width:${pct[1]}%"></b></div></div></div>`)}
function oobe(ic,h,p,body,btns){show(`<div class="oobe"><div class="card"><div class="il">${ic}</div><div class="rt"><h1>${h}</h1>${p?`<p>${p}</p>`:''}${body}</div><div class="bar">${btns}</div></div></div>`)}
function pick(){$$('.list div').forEach(d=>d.onclick=()=>{$$('.list div').forEach(x=>x.classList.remove('s'));d.classList.add('s');d.scrollIntoView({block:'nearest'})})}
const sel=()=>$('.list .s')?.textContent;
function boot(msg,ms,next,sp=1){show(`<div class="black"><div>${logo}${sp?'<div class="spin"></div>':''}${msg||''}</div></div>`);later(next,ms)}

function s1(){setup(`<div class="grow"><div style="text-align:center;margin:10px 0 24px">${logo.replace('0a8cf0','1e4fb0')}<div style="font-size:22px;color:#1e4fb0">Windows 11</div></div>
<div class="fld">Language to install:<select><option>English (United States)</option><option>Tiếng Việt (Việt Nam)</option></select></div>
<div class="fld">Time and currency format:<select><option>English (World)</option><option>Vietnamese (Vietnam)</option></select></div>
<div class="fld">Keyboard or input method:<select><option>US</option><option>Vietnamese Telex</option></select></div>
<p style="margin-top:22px">Select your language and other preferences, then click Next to continue.</p></div><footer><span style="font-size:11px;color:#666">© Microsoft Corporation. All rights reserved.</span><button class="sbtn" id="n">Next</button></footer>`,[4,0]);$('#n').onclick=s2}
function s2(){setup(`<div class="grow"><div class="big" style="margin-top:50px">Windows 11</div><div style="text-align:center"><button class="sbtn" id="n" style="font-size:22px;padding:14px 50px;border-radius:2px">Install now</button></div></div><footer><a class="lnk" style="font-size:13px">Repair your computer</a><span></span></footer>`,[6,0]);$('#n').onclick=()=>boot0(s3)}
function boot0(n){setup(`<h2>Setup is starting</h2><div class="grow" style="display:grid;place-items:center"><div class="spin d"></div></div>`,[8,0]);later(n,1400)}
function s3(){setup(`<h2>Activate Windows</h2><div class="grow"><p>If this is the first time you're installing Windows on this PC (or you're installing a different edition), you need to enter a valid Windows product key. Your product key should be in the confirmation email you received after buying a digital copy of Windows or on a label inside the box that Windows came in.</p><p>The product key looks like this: XXXXX-XXXXX-XXXXX-XXXXX-XXXXX</p><p>If you're reinstalling Windows, select I don't have a product key. Your copy of Windows will be automatically activated later.</p><input class="sin" maxlength="29" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX"></div><footer><a class="lnk" style="font-size:12px">Privacy statement</a><span><button class="sbtn" id="k">I don't have a product key</button> <button class="sbtn" id="n">Next</button></span></footer>`,[14,0]);$('#k').onclick=$('#n').onclick=s4}
function s4(){setup(`<h2>Applicable notices and license terms</h2><div class="lic grow"><b>Last updated June 2021<br><br>MICROSOFT SOFTWARE LICENSE TERMS<br><br>WINDOWS OPERATING SYSTEM<br><br>IF YOU LIVE IN (OR IF YOUR PRINCIPAL PLACE OF BUSINESS IS IN) THE UNITED STATES, PLEASE READ THE BINDING ARBITRATION CLAUSE AND CLASS ACTION WAIVER IN SECTION 11. IT AFFECTS HOW DISPUTES ARE RESOLVED.<br><br>Thank you for choosing Microsoft!</b><br><br>Depending on how you obtained the Windows software, this is a license agreement between you and the device manufacturer or software installer that distributes the software with your device, or Microsoft Corporation.</div><footer><label><input type="checkbox" id="c"> I accept the Microsoft Software License Terms. If an organization is licensing it, I am authorized to bind the organization.</label><button class="sbtn" id="n" disabled>Next</button></footer>`,[20,0]);$('#c').onchange=e=>$('#n').disabled=!e.target.checked;$('#n').onclick=s5}
function s5(){setup(`<h2>Where do you want to install Windows?</h2><div class="grow"><table><tr><th>Name</th><th>Total size</th><th>Free space</th><th>Type</th></tr><tr><td>Drive 0 Partition 1</td><td>100.0 MB</td><td>69.0 MB</td><td>System</td></tr><tr><td>Drive 0 Partition 2</td><td>16.0 MB</td><td>16.0 MB</td><td>MSR (Reserved)</td></tr><tr class="s"><td>Drive 0 Partition 3</td><td>39.9 GB</td><td>8.3 GB</td><td>Primary</td></tr><tr><td>Drive 0 Partition 4 New Volume</td><td>19.5 GB</td><td>12.7 GB</td><td>Primary</td></tr><tr><td>Drive 0 Partition 5</td><td>522.0 MB</td><td>84.0 MB</td><td>Recovery</td></tr></table><p style="margin-top:14px;font-size:12px"><a class="lnk">Refresh</a> &nbsp; <a class="lnk">Delete</a> &nbsp; <a class="lnk">Format</a> &nbsp; <a class="lnk">New</a><br><br>⚠ To install this version of Windows, the system drive needs to be 52 GB or larger.</p></div><footer><span></span><button class="sbtn" id="n">Next</button></footer>`,[26,0]);$$('tr').forEach((r,i)=>i&&(r.onclick=()=>{$$('tr').forEach(x=>x.classList.remove('s'));r.classList.add('s')}));$('#n').onclick=s6}
async function s6(){const st=['Copying Windows files','Getting files ready for installation','Installing features','Installing updates','Finishing up'];
setup(`<h2>Installing Windows</h2><div class="grow"><p>Status</p><ul class="st" style="padding:0;margin-top:30px">${st.map(s=>`<li>${s}</li>`).join('')}</ul><div class="prog"><div id="p"></div></div></div>`,[40,10]);
const L=$$('li');for(let i=0;i<5;i++){L[i].className='on';L[i].textContent=st[i]+(i<4?' (0%)':'');for(let p=0;p<=100;p+=20){if(!$('#p'))return;L[i].textContent=st[i]+(i<4?` (${p}%)`:'');$('#p').style.width=(i*20+p/5)+'%';$('.sb div:nth-child(2) b').style.width=(10+i*18+p/6)+'%';await T(i==4?300:260)}L[i].className='ok';L[i].textContent=st[i]}
setup(`<h2>Installing Windows</h2><div class="grow"><p style="margin-top:50px;text-align:center;font-size:16px">Windows needs to restart to continue<br><br>Restarting in a few seconds…</p></div>`,[40,92]);boot('Restarting…',2400,r1)}
function r1(){boot('Getting ready',3200,o1)}

const kbIcon='⌨️';
function o1(){oobe('🌏','Is this the right country or region?','',`<div class="list">${['United Kingdom','United States','Uruguay','Vietnam','Yemen','Zambia'].map(c=>`<div ${c==U.region?'class="s"':''}>${c}</div>`).join('')}</div>`,`<button class="btn" id="n">Yes</button>`);pick();$('.s').scrollIntoView();$('#n').onclick=()=>{U.region=sel()||U.region;o2()}}
function o2(){oobe(kbIcon,'Is this the right keyboard layout or input method?','If you also use another keyboard layout, you can add that next.',`<div class="list">${['US','Canadian Multilingual Standard','English (India)','Irish','NZ Aotearoa','Scottish Gaelic','Vietnamese Telex'].map(c=>`<div ${c=='US'?'class="s"':''}>${c}</div>`).join('')}</div>`,`<button class="btn" id="n">Yes</button>`);pick();$('#n').onclick=o3}
function o3(){oobe(kbIcon,'Want to add a second keyboard layout?','You can add another keyboard layout or skip this step.',`<div class="list"><div>Add layout</div></div>`,`<button class="btn g" id="k">Skip</button><button class="btn" id="n" disabled>Add layout</button>`);pick();$('#k').onclick=o4}
function o4(){oobe('<div class="spin d"></div>','Checking for updates','This might take a few minutes. Don’t turn off your PC.','',``);later(o5,3200)}
function o5(){oobe('💻',"Let's name your device",'Make it yours with a unique name that’s easy to recognize when connecting to it from other devices. Your device will restart after you name it.',`<input class="in" id="d" placeholder="Enter a name" maxlength="15" autofocus><p class="err" id="e" style="margin-top:8px">Can't contain only numbers<br>No more than 15 characters<br>No spaces or special characters other than hyphen (-)</p>`,`<button class="btn g" id="k">Skip for now</button><button class="btn" id="n">Next</button>`);$('#k').onclick=()=>{U.dev='DESKTOP-'+Math.random().toString(36).slice(2,9).toUpperCase();o6()};$('#n').onclick=()=>{const v=$('#d').value.trim();if(!v||/^\d+$/.test(v)||/[^A-Za-z0-9-]/.test(v)){$('#e').style.color='#c42b1c';return}U.dev=v;o6()}}
function o6(){oobe('<div class="spin d"></div>','Just a moment…','',``,'');later(o7,2200)}
function o7(){oobe('🪟',"Let's add your Microsoft account",'',`<p style="font-weight:600;color:var(--ink);margin:0 0 6px">Sign in</p><input class="in" id="m" type="email" placeholder="Email, phone, or Skype"><p style="margin-top:12px;font-size:13px">No account? <a class="lnk">Create one!</a></p><p class="err" id="e"></p><p style="font-size:11px">When you sign in, apps like Outlook and Microsoft Edge sync your passwords, history and settings across devices. <a class="lnk" style="font-size:11px">Learn more</a></p>`,`<button class="btn g">Sign-in options</button><button class="btn" id="n">Next</button>`);$('#n').onclick=()=>{const v=$('#m').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){$('#e').textContent="Enter a valid email address, e.g. name@outlook.com.";return}U.mail=v;o8()}}
function o8(){oobe('🔑','Enter your password','',`<p style="margin:0 0 6px">${U.mail}</p><input class="in" id="p" type="password" placeholder="Password"><p class="err" id="e"></p><a class="lnk">Forgot password?</a>`,`<button class="btn" id="n">Sign in</button>`);$('#n').onclick=()=>{if($('#p').value.length<4){$('#e').textContent='Your account or password is incorrect.';return}o9()}}
function o9(){oobe('<div class="spin d"></div>','Restoring from backup…','Almost there, this will only take a moment.','','');later(()=>oA(),2600)}
function oA(){oobe('🔐','Create a PIN','A PIN lets you sign in faster and more securely than a password.',`<input class="in" id="p" type="password" inputmode="numeric" placeholder="New PIN" maxlength="8"><input class="in" id="q" type="password" inputmode="numeric" placeholder="Confirm PIN" maxlength="8" style="margin-top:10px"><p class="err" id="e"></p>`,`<button class="btn g" id="k">Cancel</button><button class="btn" id="n">OK</button>`);$('#k').onclick=oB;$('#n').onclick=()=>{const a=$('#p').value;if(a.length<4||a!=$('#q').value){$('#e').textContent=a.length<4?'PIN must be at least 4 digits.':"PINs don't match.";return}U.pin=a;oB()}}
function oB(){const it=[['Location','Let Windows and apps request your location'],['Find my device','Keep track of your device'],['Diagnostic data','Send required data only'],['Inking & typing','Improve inking and typing recognition'],['Tailored experiences','Get tips and recommendations'],['Advertising ID','Let apps show personalized ads']];
oobe('🛡️','Choose privacy settings for your device','Microsoft puts you in control of your privacy. Choose your settings, then select Accept to save them.',`<div style="overflow:auto">${it.map((x,i)=>`<div class="tg" data-i="${i}"><div>${x[0]}<small>${x[1]}</small></div><div class="sw on"></div></div>`).join('')}</div>`,`<button class="btn" id="n">Accept</button>`);$$('.tg').forEach(t=>t.onclick=()=>t.querySelector('.sw').classList.toggle('on'));$('#n').onclick=oC}
function oC(){oobe('🌐','Always have access to your recent browsing data','When you browse the web using Microsoft Edge, we’ll bring your browsing data such as favorites, history, cookies, and more into Microsoft Edge from your other browser.',``,`<button class="btn g" id="k">Not now</button><button class="btn" id="n">Accept</button>`);$('#k').onclick=$('#n').onclick=oD}
function oD(){oobe('📊',"You're in luck: You've landed a free trial of Microsoft 365 Family",'',`<p>✔ Premium Office apps — Word, Excel and PowerPoint<br>✔ Share your subscription with up to 5 other people<br>✔ 1 TB of cloud storage per person</p><p style="font-size:12px">Credit card required. After your 1-month free trial, you'll be charged at the regular price unless cancelled.</p>`,`<button class="lnk" id="k">Decline Microsoft 365</button><button class="btn" id="n">Continue</button>`);$('#k').onclick=$('#n').onclick=fin}
async function fin(){const m=['Hi','We’re getting things ready for you','This might take several minutes','You’re 30% there<br>Please keep your computer on.','You’re 80% there<br>Please keep your computer on.'];
for(const t of m){show(`<div class="black"><div><div class="spin"></div>${t}</div></div>`);await T(2200)}
const nm=(U.mail.split('@')[0]||'User');show(`<div class="lock"><div><div class="av">👤</div><div style="font-size:20px;margin-bottom:34px">${nm}</div><div class="spin"></div>Welcome</div></div>`);await T(3200);desk(nm)}
function desk(nm){const ic=[['🗑️','Recycle Bin'],['🌐','Microsoft Edge']];
show(`<div class="desk"><div class="hint">Simulation complete — click Start. Reload to run Setup again.</div>${ic.map((x,i)=>`<div class="di" style="top:${14+i*84}px"><span>${x[0]}</span>${x[1]}</div>`).join('')}<div class="tk"><b id="st" style="color:#0a6cd1">🪟</b><b>🔍</b><b>🗂️</b><b>🌐</b><b>📁</b><b>🛍️</b><div class="clk" id="ck"></div></div></div>`);
